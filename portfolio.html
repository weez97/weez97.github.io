<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luis Pineda | Portfolio</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Oxanium:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="menu">
      <div class="menu__inner">
        <a class="menu__logo" data-link="home">LPK</a>
        <nav class="menu__nav" aria-label="Primary navigation">
          <a class="menu__link" href="#portfolio" data-i18n="portfolio">
            Portfolio
          </a>
          <a class="menu__link" data-link="about" data-i18n="about">
            About me
          </a>
          <a
            class="menu__link"
            data-link="resume"
            target="_blank"
            rel="noopener"
          >
            <span data-i18n="resume">Resume</span>
            <img
              class="menu__icon"
              src="./images/icons/google-drive.svg"
              alt=""
              aria-hidden="true"
          /></a>
          <a class="menu__cta" data-link="contact" data-i18n="contact">Contact</a>
        </nav>

        <!-- mobile menu -->
        <button class="menu__hamburger" aria-label="Open menu">
          <img src="./images/icons/menu_icon.svg" alt="" />
        </button>
      </div>
      <!-- mobile menu drawer -->
      <div class="menu__mobile">
        <a class="menu__mobileLink" href="#portfolio" data-i18n="portfolio">
          Portfolio
        </a>
        <a class="menu__mobileLink" data-link="about" data-i18n="about">
          About me
        </a>
        <a class="menu__mobileLink menu__mobileLink--drive" data-link="resume">
          <span data-i18n="resume">Resume</span>
          <img
            class="menu__icon"
            src="./images/icons/google-drive.svg"
            alt=""
            aria-hidden="true"
          />
        </a>
        <a class="menu__mobileCta" data-link="contact" data-i18n="contact"
          >Contact</a
        >
      </div>
    </header>
    <section id="portfolio" class="portfolio">
      <div class="page__titleHolder">
        <h1 class="section__title page__title" data-i18n="portfolio">
          Portfolio
        </h1>
      </div>
      <div class="portfolio__content">
        <div class="page__text" data-i18n="portfolioDesc">portfolioDesc</div>
        <div id="portfolio__grid" class="portfolio__grid"></div>
        <template id="portfolio-template">
          <a class="portfolio__element">
            <img class="portfolio__element--picture" src="" alt="" />
            <div class="portfolio__element--title"></div>
            <div class="portfolio__element--location"></div>
            <div class="portfolio__element--text"></div>
            <div class="portfolio__element--tagLine"></div>
          </a>
        </template>
      </div>
    </section>
    <footer>
      <p>
        &copy; <span id="year"></span>
        <span data-i18n="footer">Luis Pineda. All rights reserved.</span>
      </p>
    </footer>
    <script src="./js/portfolio_grid.js"></script>
    <script src="./js/menu.js"></script>
    <script src="./js/year-updater.js"></script>
    <script src="./js/links.js"></script>
    <script src="./js/i18n.js"></script>
  </body>
</html>
